# One-shot production export candidate; separate immediate approval required.
services:
  capture:
    image: ai-investment-backup:reviewed-local
    pull_policy: never
    command: [scripts/backup-capture.mjs, --remote, --allow-network, /run/capture.json, /backup]
    read_only: true
    user: '10001:10001'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 1g
    memswap_limit: 1g
    environment:
      BACKUP_STAGING_ROOT: /staging
      BACKUP_CLOUDFLARE_TOKEN_FILE: /run/cloudflare-token
      BACKUP_AGE_RECIPIENT: ${NAS_BACKUP_AGE_RECIPIENT:?Supply only the public age recipient}
    volumes:
      - type: bind
        source: ${NAS_BACKUP_CONFIG_FILE:?Set the reviewed private capture config path}
        target: /run/capture.json
        read_only: true
      - type: bind
        source: ${NAS_BACKUP_TOKEN_FILE:?Set the protected token file path}
        target: /run/cloudflare-token
        read_only: true
      - type: bind
        source: ${NAS_BACKUP_OUTPUT_DIR:?Set a dedicated private backup folder}
        target: /backup
    tmpfs:
      - /staging:rw,noexec,nosuid,nodev,size=536870912,uid=10001,gid=10001,mode=0700
      - /tmp:rw,noexec,nosuid,nodev,size=16777216,uid=10001,gid=10001,mode=0700
    restart: 'no'
