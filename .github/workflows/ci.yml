name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node scripts/preflight.mjs --allow-unconfigured
      - run: pnpm test
      - run: pnpm test:runtime
      - run: pnpm build
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: node scripts/generate.mjs
      - run: git diff --exit-code -- config/source.schema.json openapi.json
      - run: git diff --check
# No live-source requests, deployment or private artifacts in CI.
